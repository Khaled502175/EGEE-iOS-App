 workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.khaledoelgamal.EGEEApp
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Download CoreML Model from Hugging Face
        script: |
          pip3 install huggingface_hub
          huggingface-cli download khaledoelgamal/egee-arabic-speech EGEE_SpeechModel.mlpackage --local-dir EGEE_App

      - name: Generate Xcode Project
        script: xcodegen generate

      - name: Build App
        script: |
          xcodebuild -project EGEE_App.xcodeproj -scheme EGEE_App -sdk iphoneos -configuration Debug -archivePath $CM_BUILD_DIR/EGEE_App.xcarchive archive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive -archivePath $CM_BUILD_DIR/EGEE_App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $CM_BUILD_DIR/build
    artifacts:
      - $CM_BUILD_DIR/build/*.ipa